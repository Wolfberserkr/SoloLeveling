name: Deploy Edge Functions

# Ships the Supabase edge functions whenever their code changes, so the repo,
# the database, and the running functions can't drift apart. Auth is the
# SUPABASE_ACCESS_TOKEN repository secret (Supabase dashboard → Account →
# Access Tokens); the CLI reads it from the environment. No `supabase link` is
# needed — the project ref is passed explicitly.

on:
  push:
    branches: [main, master, 'claude/**']
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      function:
        description: Which function to deploy
        type: choice
        options:
          - all
          - game
          - cron
        default: all

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: npqpzzarohlvexqpqurg
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI bundles each function's import graph, so deploying `game`
      # includes its ../_shared/game/* imports automatically.
      - name: Deploy game
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.function == 'all' || inputs.function == 'game' }}
        run: supabase functions deploy game --project-ref "$PROJECT_REF"

      # cron authenticates with a shared secret, not a user JWT
      # (see [functions.cron] verify_jwt = false in supabase/config.toml).
      - name: Deploy cron
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.function == 'all' || inputs.function == 'cron' }}
        run: supabase functions deploy cron --project-ref "$PROJECT_REF" --no-verify-jwt
