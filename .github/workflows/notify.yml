name: Push Notifications Cron

on:
  schedule:
    # Runs every 30 minutes. GitHub Actions free tier supports this.
    # Note: GitHub cron has ~1-5 min delay under load — good enough for reminders.
    - cron: '0,30 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger notification cron
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/notify" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
